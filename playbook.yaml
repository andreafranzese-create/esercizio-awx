---
- name: Preleva sorgente Java dalla VM
  hosts: all
  gather_facts: false

  vars:
    src_path: /opt/app/esempio.java
    jenkins_url: "http://192.168.56.12:8080"
    jenkins_token: awx-java-build

  tasks:
    - name: Leggi il file dalla VM
      ansible.builtin.slurp:
        src: "{{ src_path }}"
      register: java_src

    - name: Salva nome e contenuto negli artifacts del job AWX
      ansible.builtin.set_stats:
        data:
          java_filename: "{{ src_path | basename }}"
          java_b64: "{{ java_src.content }}"
        per_host: false

    - name: Invia il file al webhook di Jenkins
      ansible.builtin.uri:
        url: "{{ jenkins_url }}/generic-webhook-trigger/invoke?token={{ jenkins_token }}"
        method: POST
        body_format: json
        body:
          awx_job_id: "{{ awx_job_id) }}"
          filename: "{{ src_path | basename }}"
          content_b64: "{{ java_src.content }}"
        status_code: 200
      delegate_to: localhost
      run_once: true