---
---
- name: Preleva nginx.conf dalla VM
  hosts: all
  gather_facts: false

  vars:
    src_path: /etc/nginx/nginx.conf

  tasks:
    - name: Leggi il file dalla VM
      ansible.builtin.slurp:
        src: "{{ src_path }}"
      register: conf_src

    - name: Salva nome e contenuto negli artifacts del job AWX
      ansible.builtin.set_stats:
        data:
          filename: "{{ src_path | basename }}"
          content_b64: "{{ conf_src.content }}"
        per_host: false